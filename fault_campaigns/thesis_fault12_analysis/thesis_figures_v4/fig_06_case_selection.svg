<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="780" viewBox="0 0 1450 780">
<rect width="100%" height="100%" fill="#ffffff"/>
<style><![CDATA[text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#4b5563}.axis{font-size:16px;fill:#4b5563}.tick{font-size:14px;fill:#6b7280}.label{font-size:18px;font-weight:700}.note{font-size:16px;fill:#4b5563}]]></style>
<text x="70" y="62" text-anchor="start" class="title">Representative cases for follow-up propagation analysis</text>
<text x="70" y="95" text-anchor="start" class="subtitle">Typical cases are selected for clean layer-by-layer evidence; extreme cases are exploratory.</text>
<line x1="70" y1="120" x2="1380" y2="120" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="95" y="190" width="610" height="145" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="120" y="228" text-anchor="start" style="font-size:20px;font-weight:700;fill:#2563eb">Typical: W008 / Masking</text>
<text x="120" y="268" text-anchor="start" style="font-size:16px">mean slowdown=6.81s; matched success B/F=6/6</text>
<text x="120" y="302" text-anchor="start" style="font-size:16px">controller update delta=6.7</text>
<rect x="770" y="190" width="610" height="145" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="795" y="228" text-anchor="start" style="font-size:20px;font-weight:700;fill:#f97316">Typical: W240 / Dropout</text>
<text x="795" y="268" text-anchor="start" style="font-size:16px">mean slowdown=6.47s; matched success B/F=6/6</text>
<text x="795" y="302" text-anchor="start" style="font-size:16px">controller update delta=6.5</text>
<rect x="95" y="375" width="610" height="145" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="120" y="413" text-anchor="start" style="font-size:20px;font-weight:700;fill:#2563eb">Extreme: W173 / Masking</text>
<text x="120" y="453" text-anchor="start" style="font-size:16px">mean slowdown=44.95s; matched success B/F=5/6</text>
<text x="120" y="487" text-anchor="start" style="font-size:16px">controller update delta=43.8</text>
<rect x="770" y="375" width="610" height="145" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="795" y="413" text-anchor="start" style="font-size:20px;font-weight:700;fill:#f97316">Extreme: W076 / Dropout</text>
<text x="795" y="453" text-anchor="start" style="font-size:16px">mean slowdown=35.60s; matched success B/F=5/6</text>
<text x="795" y="487" text-anchor="start" style="font-size:16px">controller update delta=34.8</text>
<text x="725" y="670" text-anchor="middle" class="note">Typical-case rule: 6/6 matched success + measurable non-extreme slowdown + observable controller response.</text>
</svg>
