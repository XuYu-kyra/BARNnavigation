<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="100%" height="100%" fill="#f7f4ee"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1d252c"/></marker></defs>
<text x="60" y="65" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#1d252c" text-anchor="start">Data Analysis Design</text>
<text x="60" y="100" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64717a" text-anchor="start">From paired experiment records to interpretable statistical evidence.</text>
<rect x="80" y="190" width="190" height="110" rx="20" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="175.0" y="232" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#1d252c" text-anchor="middle">Paired runs</text>
<text x="175.0" y="262" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">baseline/fault in same</text>
<text x="175.0" y="280" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">world</text>
<rect x="320" y="190" width="190" height="110" rx="20" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="415.0" y="232" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#1d252c" text-anchor="middle">Pair differences</text>
<text x="415.0" y="262" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">d = fault - baseline</text>
<rect x="560" y="120" width="210" height="100" rx="20" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="665.0" y="162" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#1d252c" text-anchor="middle">Descriptive layer</text>
<text x="665.0" y="192" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">mean, median, degradation</text>
<text x="665.0" y="210" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">fraction</text>
<rect x="560" y="260" width="210" height="100" rx="20" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="665.0" y="302" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#1d252c" text-anchor="middle">Bootstrap CI</text>
<text x="665.0" y="332" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">uncertainty without</text>
<text x="665.0" y="350" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">normality assumption</text>
<rect x="820" y="120" width="210" height="100" rx="20" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="925.0" y="162" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#1d252c" text-anchor="middle">Bayesian layer</text>
<text x="925.0" y="192" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">P(degradation),</text>
<text x="925.0" y="210" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">P(meaningful)</text>
<rect x="820" y="260" width="210" height="100" rx="20" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="925.0" y="302" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#1d252c" text-anchor="middle">Hierarchical layer</text>
<text x="925.0" y="332" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">global effect + world</text>
<text x="925.0" y="350" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">susceptibility</text>
<rect x="1080" y="190" width="150" height="110" rx="20" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="1155.0" y="232" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#1d252c" text-anchor="middle">Interpretation</text>
<text x="1155.0" y="262" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">fault propagation</text>
<text x="1155.0" y="280" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">evidence</text>
<line x1="270" y1="245" x2="320" y2="245" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="510" y1="245" x2="560" y2="170" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="510" y1="245" x2="560" y2="310" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="770" y1="170" x2="820" y2="170" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="770" y1="310" x2="820" y2="310" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1030" y1="170" x2="1080" y2="245" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1030" y1="310" x2="1080" y2="245" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="80" y="560" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#1d252c" text-anchor="start">Design justification: each layer answers a different question, from observed effect to uncertainty to world-dependent susceptibility.</text>
</svg>
