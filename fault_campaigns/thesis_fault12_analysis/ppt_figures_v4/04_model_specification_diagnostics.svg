<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="100%" height="100%" fill="#f8fafc"/>
<style><![CDATA[text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:42px;font-weight:700}.subtitle{font-size:22px;fill:#475569}.small{font-size:17px;fill:#475569}.tiny{font-size:14px;fill:#64748b}.label{font-size:20px;font-weight:700}.metric{font-size:18px;fill:#334155}.note{font-size:18px;fill:#475569}]]></style>
<text x="70" y="78" text-anchor="start" class="title">Robust Hierarchical Bayesian Model</text>
<text x="72" y="116" text-anchor="start" class="subtitle">Student-t likelihood, pairs nested within worlds, and partial pooling for world susceptibility.</text>
<line x1="70" y1="138" x2="1530" y2="138" stroke="#cbd5e1" stroke-width="2"/>
<rect x="95" y="185" width="690" height="310" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="135" y="235" text-anchor="start" style="font-size:28px;font-weight:700">Model specification</text>
<text x="145" y="300" text-anchor="start" style="font-size:32px;font-weight:700;fill:#1e3a8a">dᵢⱼ ~ Student-t(ν, θⱼ, σ)</text>
<text x="145" y="355" text-anchor="start" style="font-size:32px;font-weight:700;fill:#1e3a8a">θⱼ ~ Normal(μ, τ)</text>
<text x="145" y="415" text-anchor="start" class="note">i = paired repetition</text>
<text x="145" y="443" text-anchor="start" class="note">j = world</text>
<text x="145" y="471" text-anchor="start" class="note">positive d means performance degradation</text>
<rect x="815" y="185" width="685" height="310" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="855" y="235" text-anchor="start" style="font-size:28px;font-weight:700">Actual priors used</text>
<text x="865" y="292" text-anchor="start" class="note">μ ~ Normal(0, 10 × prior_scale)</text>
<text x="865" y="328" text-anchor="start" class="note">τ, σ ~ HalfNormal(5 × prior_scale)</text>
<text x="865" y="364" text-anchor="start" class="note">ν - 2 ~ Exponential(1/30)</text>
<text x="865" y="400" text-anchor="start" class="note">θ uses non-centred parameterisation</text>
<rect x="95" y="540" width="1405" height="250" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="135" y="590" text-anchor="start" style="font-size:27px;font-weight:700">Meeting-level diagnostics for global effect μ</text>
<rect x="155" y="630" width="585" height="95" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="180" y="670" text-anchor="start" style="font-size:22px;font-weight:700;fill:#2563eb">Frontal masking</text>
<text x="180" y="707" text-anchor="start" style="font-size:20px">R-hat(μ)=1.000; ESS_bulk(μ)=2601; τ median=1.30</text>
<rect x="790" y="630" width="585" height="95" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="815" y="670" text-anchor="start" style="font-size:22px;font-weight:700;fill:#f97316">LiDAR dropout</text>
<text x="815" y="707" text-anchor="start" style="font-size:20px">R-hat(μ)=1.002; ESS_bulk(μ)=1498; τ median=2.10</text>
<text x="135" y="765" text-anchor="start" style="font-size:20px;fill:#475569">For dissertation: also report all key-parameter R-hat/ESS, divergences and posterior predictive checks.</text>
</svg>
