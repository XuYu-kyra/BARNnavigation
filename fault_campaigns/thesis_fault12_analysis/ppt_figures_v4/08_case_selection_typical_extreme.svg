<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="100%" height="100%" fill="#f8fafc"/>
<style><![CDATA[text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:42px;font-weight:700}.subtitle{font-size:22px;fill:#475569}.small{font-size:17px;fill:#475569}.tiny{font-size:14px;fill:#64748b}.label{font-size:20px;font-weight:700}.metric{font-size:18px;fill:#334155}.note{font-size:18px;fill:#475569}]]></style>
<text x="70" y="78" text-anchor="start" class="title">Case Selection for Follow-Up Propagation Evidence</text>
<text x="72" y="116" text-anchor="start" class="subtitle">Use clean typical cases for layer-by-layer evidence; treat extreme cases separately.</text>
<line x1="70" y1="138" x2="1530" y2="138" stroke="#cbd5e1" stroke-width="2"/>
<rect x="115" y="220" width="660" height="180" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="143" y="268" text-anchor="start" style="font-size:25px;font-weight:700;fill:#2563eb">Typical: W008 / Frontal masking</text>
<text x="143" y="310" text-anchor="start" style="font-size:19px">raw slowdown mean: 6.81s; success counts B/F: 6/6</text>
<text x="143" y="344" text-anchor="start" style="font-size:19px">controller update delta: 6.7</text>
<text x="143" y="378" text-anchor="start" style="font-size:17px;fill:#475569">6/6 matched success; moderate slowdown; controller response observable</text>
<rect x="835" y="220" width="660" height="180" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="863" y="268" text-anchor="start" style="font-size:25px;font-weight:700;fill:#f97316">Typical: W240 / LiDAR dropout</text>
<text x="863" y="310" text-anchor="start" style="font-size:19px">raw slowdown mean: 6.47s; success counts B/F: 6/6</text>
<text x="863" y="344" text-anchor="start" style="font-size:19px">controller update delta: 6.5</text>
<text x="863" y="378" text-anchor="start" style="font-size:17px;fill:#475569">6/6 matched success; moderate slowdown; controller response observable</text>
<rect x="115" y="440" width="660" height="180" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="143" y="488" text-anchor="start" style="font-size:25px;font-weight:700;fill:#2563eb">Extreme: W173 / Frontal masking</text>
<text x="143" y="530" text-anchor="start" style="font-size:19px">raw slowdown mean: 44.95s; success counts B/F: 5/6</text>
<text x="143" y="564" text-anchor="start" style="font-size:19px">controller update delta: 43.8</text>
<text x="143" y="598" text-anchor="start" style="font-size:17px;fill:#475569">largest raw slowdown; high variability; exploratory follow-up</text>
<rect x="835" y="440" width="660" height="180" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="863" y="488" text-anchor="start" style="font-size:25px;font-weight:700;fill:#f97316">Extreme: W076 / LiDAR dropout</text>
<text x="863" y="530" text-anchor="start" style="font-size:19px">raw slowdown mean: 35.60s; success counts B/F: 5/6</text>
<text x="863" y="564" text-anchor="start" style="font-size:19px">controller update delta: 34.8</text>
<text x="863" y="598" text-anchor="start" style="font-size:17px;fill:#475569">largest raw slowdown; high variability; exploratory follow-up</text>
<rect x="120" y="740" width="1360" height="70" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
<text x="150" y="782" text-anchor="start" style="font-size:21px;font-weight:700;fill:#15803d">Typical-case rule:</text>
<text x="340" y="782" text-anchor="start" style="font-size:20px">clean 6/6 matched success + measurable non-extreme slowdown + observable controller response.</text>
</svg>
