<text x="165" y="263" text-anchor="start" style="font-size:22px;font-weight:700;fill:#2563eb">Frontal masking</text>
<line x1="680.2522735849058" y1="255" x2="825.9746268617023" y2="255" stroke="#0f172a" stroke-width="4"/>
