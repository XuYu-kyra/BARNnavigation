<text x="70" y="78" text-anchor="start" class="title">Completion-Time Degradation: Primary vs Sensitivity</text>
<text x="72" y="116" text-anchor="start" class="subtitle">Primary = matched-success pairs; all-pair/capped completion is reported only as sensitivity.</text>
