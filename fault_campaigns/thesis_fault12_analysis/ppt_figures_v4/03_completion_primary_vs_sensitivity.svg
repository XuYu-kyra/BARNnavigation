<rect x="110" y="770" width="1380" height="70" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
<text x="135" y="813" text-anchor="start" style="font-size:21px;font-weight:700;fill:#15803d">Interpretation:</text>
<text x="290" y="813" text-anchor="start" style="font-size:20px">Including non-success/capped outcomes increases estimates but also uncertainty; this supports, not weakens, the primary design.</text>
