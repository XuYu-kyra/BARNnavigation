<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="100%" height="100%" fill="#f8fafc"/>
<style><![CDATA[text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:42px;font-weight:700}.subtitle{font-size:22px;fill:#475569}.small{font-size:17px;fill:#475569}.tiny{font-size:14px;fill:#64748b}.label{font-size:20px;font-weight:700}.metric{font-size:18px;fill:#334155}.note{font-size:18px;fill:#475569}]]></style>
<text x="70" y="78" text-anchor="start" class="title">Analysis Questions and Current Evidence</text>
<text x="72" y="116" text-anchor="start" class="subtitle">The current analysis supports effect estimation; full cross-layer propagation is the next evidence target.</text>
<line x1="70" y1="138" x2="1530" y2="138" stroke="#cbd5e1" stroke-width="2"/>
<rect x="105" y="205" width="1390" height="115" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="155" cy="263" r="32" fill="#e2e8f0" stroke="none" stroke-width="1"/>
<text x="155" y="273" text-anchor="middle" style="font-size:24px;font-weight:700">Q1</text>
<text x="210" y="251" text-anchor="start" style="font-size:24px;font-weight:700">Do faults slow successful navigation?</text>
<rect x="990" y="230" width="270" height="42" rx="20" fill="#dcfce7" stroke="#ffffff" stroke-width="1"/>
<text x="1125" y="259" text-anchor="middle" style="font-size:18px;font-weight:700">Supported</text>
<text x="210" y="293" text-anchor="start" style="font-size:19px;fill:#475569">Matched-success bootstrap + Bayesian estimates show positive slowdown.</text>
<rect x="105" y="340" width="1390" height="115" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="155" cy="398" r="32" fill="#e2e8f0" stroke="none" stroke-width="1"/>
<text x="155" y="408" text-anchor="middle" style="font-size:24px;font-weight:700">Q2</text>
<text x="210" y="386" text-anchor="start" style="font-size:24px;font-weight:700">How does intermittent dropout differ from continuous masking?</text>
<rect x="990" y="365" width="270" height="42" rx="20" fill="#fef9c3" stroke="#ffffff" stroke-width="1"/>
<text x="1125" y="394" text-anchor="middle" style="font-size:18px;font-weight:700">Directional support</text>
<text x="210" y="428" text-anchor="start" style="font-size:19px;fill:#475569">Dropout appears smaller / less threshold-stable than masking.</text>
<rect x="105" y="475" width="1390" height="115" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="155" cy="533" r="32" fill="#e2e8f0" stroke="none" stroke-width="1"/>
<text x="155" y="543" text-anchor="middle" style="font-size:24px;font-weight:700">Q3</text>
<text x="210" y="521" text-anchor="start" style="font-size:24px;font-weight:700">Does susceptibility vary across environments?</text>
<rect x="990" y="500" width="270" height="42" rx="20" fill="#e0f2fe" stroke="#ffffff" stroke-width="1"/>
<text x="1125" y="529" text-anchor="middle" style="font-size:18px;font-weight:700">Supported, nuanced</text>
<text x="210" y="563" text-anchor="start" style="font-size:19px;fill:#475569">World effects differ, but claims about stronger dropout heterogeneity need τ/PPC support.</text>
<rect x="105" y="610" width="1390" height="115" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="155" cy="668" r="32" fill="#e2e8f0" stroke="none" stroke-width="1"/>
<text x="155" y="678" text-anchor="middle" style="font-size:24px;font-weight:700">Q4</text>
<text x="210" y="656" text-anchor="start" style="font-size:24px;font-weight:700">Can we explain the effect through the Nav2 pipeline?</text>
<rect x="990" y="635" width="270" height="42" rx="20" fill="#ffedd5" stroke="#ffffff" stroke-width="1"/>
<text x="1125" y="664" text-anchor="middle" style="font-size:18px;font-weight:700">Partial</text>
<text x="210" y="698" text-anchor="start" style="font-size:19px;fill:#475569">Proxy metrics are mechanism-consistent; time-aligned propagation evidence remains next step.</text>
<rect x="135" y="765" width="1330" height="62" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="165" y="804" text-anchor="start" style="font-size:21px;font-weight:700">Next highest-value work:</text>
<text x="405" y="804" text-anchor="start" style="font-size:20px">W8 masking + W240 dropout time-aligned scan → costmap → controller → cmd_vel → motion evidence.</text>
</svg>
