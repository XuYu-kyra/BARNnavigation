<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="100%" height="100%" fill="#f8fafc"/>
<style><![CDATA[text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:42px;font-weight:700}.subtitle{font-size:22px;fill:#475569}.small{font-size:17px;fill:#475569}.tiny{font-size:14px;fill:#64748b}.label{font-size:20px;font-weight:700}.metric{font-size:18px;fill:#334155}.note{font-size:18px;fill:#475569}]]></style>
<text x="70" y="78" text-anchor="start" class="title">Bayesian Threshold Sensitivity</text>
<text x="72" y="116" text-anchor="start" class="subtitle">Thresholds are exploratory practical-effect cutoffs; they should not be over-interpreted as hard pass/fail tests.</text>
<line x1="70" y1="138" x2="1530" y2="138" stroke="#cbd5e1" stroke-width="2"/>
<text x="115" y="195" text-anchor="start" style="font-size:24px;font-weight:700">Fault</text>
<text x="445.0" y="195" text-anchor="middle" style="font-size:22px;font-weight:700">P(slowdown &gt; 0s)</text>
<text x="675.0" y="195" text-anchor="middle" style="font-size:22px;font-weight:700">P(slowdown &gt; 3s)</text>
<text x="905.0" y="195" text-anchor="middle" style="font-size:22px;font-weight:700">P(slowdown &gt; 5s)</text>
<text x="1135.0" y="195" text-anchor="middle" style="font-size:22px;font-weight:700">P(slowdown &gt; 7s)</text>
<text x="115" y="308" text-anchor="start" style="font-size:23px;font-weight:700;fill:#2563eb">Frontal masking</text>
<rect x="330" y="250" width="214" height="79" rx="12" fill="#dbeafe" stroke="#ffffff" stroke-width="2"/>
<text x="437.0" y="305" text-anchor="middle" style="font-size:29px;font-weight:700;fill:#0f172a">&gt;0.999</text>
<rect x="560" y="250" width="214" height="79" rx="12" fill="#dbeafe" stroke="#ffffff" stroke-width="2"/>
<text x="667.0" y="305" text-anchor="middle" style="font-size:29px;font-weight:700;fill:#0f172a">0.994</text>
<rect x="790" y="250" width="214" height="79" rx="12" fill="#dbeafe" stroke="#ffffff" stroke-width="2"/>
<text x="897.0" y="305" text-anchor="middle" style="font-size:29px;font-weight:700;fill:#0f172a">0.843</text>
<rect x="1020" y="250" width="214" height="79" rx="12" fill="#dbeafe" stroke="#ffffff" stroke-width="2"/>
<text x="1127.0" y="305" text-anchor="middle" style="font-size:29px;font-weight:700;fill:#0f172a">0.258</text>
<text x="115" y="403" text-anchor="start" style="font-size:23px;font-weight:700;fill:#f97316">LiDAR dropout</text>
<rect x="330" y="345" width="214" height="79" rx="12" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/>
<text x="437.0" y="400" text-anchor="middle" style="font-size:29px;font-weight:700;fill:#0f172a">0.998</text>
<rect x="560" y="345" width="214" height="79" rx="12" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/>
<text x="667.0" y="400" text-anchor="middle" style="font-size:29px;font-weight:700;fill:#0f172a">0.883</text>
<rect x="790" y="345" width="214" height="79" rx="12" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/>
<text x="897.0" y="400" text-anchor="middle" style="font-size:29px;font-weight:700;fill:#0f172a">0.342</text>
<rect x="1020" y="345" width="214" height="79" rx="12" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/>
<text x="1127.0" y="400" text-anchor="middle" style="font-size:29px;font-weight:700;fill:#0f172a">0.033</text>
<rect x="115" y="515" width="1365" height="210" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="150" y="565" text-anchor="start" style="font-size:28px;font-weight:700">How to say it</text>
<text x="150" y="615" text-anchor="start" class="note">Both faults probably slow successful navigation: P(slowdown &gt; 0) is very high under the fitted model.</text>
<text x="150" y="649" text-anchor="start" class="note">Evidence for exceeding the exploratory 5s threshold is much stronger for frontal masking.</text>
<text x="150" y="683" text-anchor="start" class="note">Dropout is not 'no effect'; it is a smaller / less threshold-stable estimated slowdown.</text>
</svg>
