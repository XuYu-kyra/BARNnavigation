<text x="135" y="778" text-anchor="start" style="font-size:22px;font-weight:700;fill:#c2410c">Key point:</text>
<text x="260" y="778" text-anchor="start" style="font-size:21px;fill:#334155">No simple systematic shift to failure; many failures are world difficulty. Completion-time inference therefore uses success-success pairs.</text>
