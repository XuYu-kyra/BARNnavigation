<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="100%" height="100%" fill="#f7f4ee"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1d252c"/></marker></defs>
<text x="60" y="65" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#1d252c" text-anchor="start">Revised Data Analysis Design</text>
<text x="60" y="100" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64717a" text-anchor="start">Bootstrap and hierarchical Bayesian modelling are complementary inferential routes, not separate “Bayesian vs hierarchical” layers.</text>
<rect x="90" y="170" width="210" height="80" rx="18" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="195.0" y="204" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d252c" text-anchor="middle">Paired runs</text>
<text x="195.0" y="231" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">baseline/fault, same world</text>
<rect x="90" y="300" width="210" height="80" rx="18" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="195.0" y="334" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d252c" text-anchor="middle">Pair differences</text>
<text x="195.0" y="361" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">d = fault - baseline</text>
<rect x="390" y="150" width="220" height="105" rx="18" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="500.0" y="184" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d252c" text-anchor="middle">Descriptive summary</text>
<text x="500.0" y="211" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">mean, median, degradation fraction</text>
<rect x="390" y="295" width="220" height="105" rx="18" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="500.0" y="329" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d252c" text-anchor="middle">Cluster bootstrap</text>
<text x="500.0" y="356" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">world-aware uncertainty estimate</text>
<rect x="710" y="200" width="260" height="145" rx="18" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="840.0" y="234" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d252c" text-anchor="middle">Robust hierarchical Bayesian</text>
<text x="840.0" y="261" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">Student-t likelihood + world effects</text>
<rect x="1035" y="160" width="175" height="70" rx="18" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="1122.5" y="194" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d252c" text-anchor="middle">Global effect</text>
<text x="1122.5" y="221" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">mu</text>
<rect x="1035" y="260" width="175" height="70" rx="18" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="1122.5" y="294" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d252c" text-anchor="middle">World effects</text>
<text x="1122.5" y="321" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">theta_j</text>
<rect x="1035" y="360" width="175" height="70" rx="18" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="1122.5" y="394" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d252c" text-anchor="middle">Probabilities</text>
<text x="1122.5" y="421" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">P(effect &gt; threshold)</text>
<line x1="195" y1="250" x2="195" y2="300" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="300" y1="340" x2="390" y2="202" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="300" y1="340" x2="390" y2="348" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="610" y1="202" x2="710" y2="272" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="610" y1="348" x2="710" y2="272" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="970" y1="272" x2="1035" y2="195" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="970" y1="272" x2="1035" y2="295" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="970" y1="272" x2="1035" y2="395" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="90" y="580" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1d252c" text-anchor="start">Interpretation combines: observed paired effects + uncertainty + probability of degradation + world-specific susceptibility.</text>
<text x="90" y="615" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64717a" text-anchor="start">This structure avoids implying that “Bayesian” and “hierarchical” are independent methods; the hierarchical model is Bayesian.</text>
</svg>
