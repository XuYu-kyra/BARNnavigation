<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="100%" height="100%" fill="#f7f4ee"/>
<text x="60" y="65" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#1d252c" text-anchor="start">Wording Adjustments to Avoid Statistical Overclaiming</text>
<rect x="110" y="145" width="1060" height="60" rx="8" fill="#1d252c" stroke="none" stroke-width="1"/>
<text x="370" y="183" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">Avoid</text>
<text x="900" y="183" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">Use instead</text>
<rect x="110" y="205" width="530" height="82" rx="0" fill="#fffaf2" stroke="#d8d2c8" stroke-width="1"/>
<rect x="640" y="205" width="530" height="82" rx="0" fill="#fdf7ed" stroke="#d8d2c8" stroke-width="1"/>
<text x="135" y="240" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#c2410c" text-anchor="start">world structure mediates fault impact</text>
<text x="665" y="235" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#2f855a" text-anchor="start">fault impact varies across environments / environment appears to mod</text>
<text x="665" y="260" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#2f855a" text-anchor="start">ify impact</text>
<rect x="110" y="287" width="530" height="82" rx="0" fill="#fffaf2" stroke="#d8d2c8" stroke-width="1"/>
<rect x="640" y="287" width="530" height="82" rx="0" fill="#fdf7ed" stroke="#d8d2c8" stroke-width="1"/>
<text x="135" y="322" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#c2410c" text-anchor="start">pipeline metrics prove propagation</text>
<text x="665" y="330" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#2f855a" text-anchor="start">pipeline metrics are consistent with proposed propagation mechanism</text>
<rect x="110" y="369" width="530" height="82" rx="0" fill="#fffaf2" stroke="#d8d2c8" stroke-width="1"/>
<rect x="640" y="369" width="530" height="82" rx="0" fill="#fdf7ed" stroke="#d8d2c8" stroke-width="1"/>
<text x="135" y="404" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#c2410c" text-anchor="start">PyMC result</text>
<text x="665" y="412" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#2f855a" text-anchor="start">hierarchical Bayesian estimates</text>
<rect x="110" y="451" width="530" height="82" rx="0" fill="#fffaf2" stroke="#d8d2c8" stroke-width="1"/>
<rect x="640" y="451" width="530" height="82" rx="0" fill="#fdf7ed" stroke="#d8d2c8" stroke-width="1"/>
<text x="135" y="486" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#c2410c" text-anchor="start">P=1.000 means certain</text>
<text x="665" y="494" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#2f855a" text-anchor="start">posterior probability &gt;99.9% under the fitted model</text>
<rect x="110" y="533" width="530" height="82" rx="0" fill="#fffaf2" stroke="#d8d2c8" stroke-width="1"/>
<rect x="640" y="533" width="530" height="82" rx="0" fill="#fdf7ed" stroke="#d8d2c8" stroke-width="1"/>
<text x="135" y="568" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#c2410c" text-anchor="start">n=54 completion-time result</text>
<text x="665" y="576" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#2f855a" text-anchor="start">54 all-pair sensitivity; matched-success n reported separately</text>
</svg>
