<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="100%" height="100%" fill="#f7f4ee"/>
<text x="60" y="65" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#1d252c" text-anchor="start">Case Selection: Typical Propagation vs Extreme Sensitivity</text>
<text x="60" y="100" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64717a" text-anchor="start">Use clean success-success worlds for typical propagation; keep largest-effect worlds as extreme sensitivity examples.</text>
<rect x="90" y="155" width="500" height="165" rx="18" fill="#fffaf2" stroke="#1f6f8b" stroke-width="3"/>
<text x="114" y="190" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f6f8b" text-anchor="start">Typical masking</text>
<text x="114" y="220" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1d252c" text-anchor="start">Frontal masking - W8</text>
<text x="114" y="250" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d252c" text-anchor="start">Mean slowdown: +6.81s</text>
<text x="114" y="277" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d252c" text-anchor="start">Controller updates: +6.7</text>
<text x="350" y="250" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="start">clean 6/6 success-success</text>
<rect x="680" y="155" width="500" height="165" rx="18" fill="#fffaf2" stroke="#d9822b" stroke-width="3"/>
<text x="704" y="190" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#d9822b" text-anchor="start">Typical dropout</text>
<text x="704" y="220" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1d252c" text-anchor="start">LiDAR dropout - W240</text>
<text x="704" y="250" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d252c" text-anchor="start">Mean slowdown: +6.47s</text>
<text x="704" y="277" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d252c" text-anchor="start">Controller updates: +6.5</text>
<text x="940" y="250" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="start">clean 6/6 success-success</text>
<rect x="90" y="365" width="500" height="165" rx="18" fill="#fffaf2" stroke="#1f6f8b" stroke-width="3"/>
<text x="114" y="400" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f6f8b" text-anchor="start">Extreme masking</text>
<text x="114" y="430" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1d252c" text-anchor="start">Frontal masking - W173</text>
<text x="114" y="460" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d252c" text-anchor="start">Mean slowdown: +44.95s</text>
<text x="114" y="487" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d252c" text-anchor="start">Controller updates: +43.8</text>
<text x="350" y="460" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="start">largest slowdown; includes collision→success</text>
<rect x="680" y="365" width="500" height="165" rx="18" fill="#fffaf2" stroke="#d9822b" stroke-width="3"/>
<text x="704" y="400" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#d9822b" text-anchor="start">Extreme dropout</text>
<text x="704" y="430" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1d252c" text-anchor="start">LiDAR dropout - W76</text>
<text x="704" y="460" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d252c" text-anchor="start">Mean slowdown: +35.60s</text>
<text x="704" y="487" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d252c" text-anchor="start">Controller updates: +34.8</text>
<text x="940" y="460" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="start">largest slowdown; includes collision→success</text>
<text x="90" y="640" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d252c" text-anchor="start">This avoids presenting high-variability worlds as “representative”; they become stress/extreme cases instead.</text>
</svg>
