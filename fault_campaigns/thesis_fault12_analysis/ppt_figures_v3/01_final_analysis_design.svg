<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="100%" height="100%" fill="#f7f4ee"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1d252c"/></marker></defs>
<text x="60" y="65" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#1d252c" text-anchor="start">Data Analysis Design</text>
<text x="60" y="100" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64717a" text-anchor="start">Paired, cluster-aware and hierarchical analysis of fault effects.</text>
<rect x="80" y="170" width="220" height="85" rx="18" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="190" y="205" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#1d252c" text-anchor="middle">Paired runs</text>
<text x="190" y="232" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">baseline/fault in same world</text>
<rect x="80" y="310" width="220" height="85" rx="18" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="190" y="345" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#1d252c" text-anchor="middle">Pair differences</text>
<text x="190" y="372" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">d = fault - baseline</text>
<line x1="190" y1="255" x2="190" y2="310" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="405" y="145" width="275" height="95" rx="18" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="542" y="181" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d252c" text-anchor="middle">Descriptive summary</text>
<text x="542" y="208" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">mean / median / degradation fraction</text>
<line x1="300" y1="352" x2="405" y2="192" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="405" y="285" width="275" height="95" rx="18" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="542" y="321" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d252c" text-anchor="middle">Cluster bootstrap</text>
<text x="542" y="348" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">world-aware uncertainty</text>
<line x1="300" y1="352" x2="405" y2="332" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="405" y="425" width="275" height="95" rx="18" fill="#fffaf2" stroke="#d8d2c8" stroke-width="2"/>
<text x="542" y="461" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d252c" text-anchor="middle">Robust hierarchical Bayesian</text>
<text x="542" y="488" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#64717a" text-anchor="middle">Student-t + world effects</text>
<line x1="300" y1="352" x2="405" y2="472" stroke="#1d252c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="790" y="390" width="135" height="72" rx="14" fill="#fdf7ed" stroke="#d8d2c8" stroke-width="1"/>
<text x="857" y="432" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1d252c" text-anchor="middle">global effect μ</text>
<line x1="680" y1="472" x2="790" y2="426" stroke="#1d252c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="960" y="390" width="135" height="72" rx="14" fill="#fdf7ed" stroke="#d8d2c8" stroke-width="1"/>
<text x="1027" y="432" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1d252c" text-anchor="middle">world effects θj</text>
<line x1="680" y1="472" x2="960" y2="426" stroke="#1d252c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1130" y="390" width="135" height="72" rx="14" fill="#fdf7ed" stroke="#d8d2c8" stroke-width="1"/>
<text x="1197" y="432" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1d252c" text-anchor="middle">P(effect &gt; threshold)</text>
<line x1="680" y1="472" x2="1130" y2="426" stroke="#1d252c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="790" y="170" width="420" height="95" rx="18" fill="#fffaf2" stroke="#2f855a" stroke-width="2"/>
<text x="1000" y="207" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#2f855a" text-anchor="middle">Interpretation</text>
<text x="1000" y="235" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#64717a" text-anchor="middle">combine evidence without over-claiming causality</text>
<line x1="680" y1="192" x2="790" y2="218" stroke="#1d252c" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="680" y1="332" x2="790" y2="218" stroke="#1d252c" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="680" y1="472" x2="790" y2="218" stroke="#1d252c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="80" y="635" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#1d252c" text-anchor="start">Key point: descriptive, bootstrap and Bayesian analyses are parallel evidence routes from the same paired differences.</text>
</svg>
